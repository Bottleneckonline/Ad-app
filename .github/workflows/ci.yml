name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android app + shared core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core, build and lint the app
        run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --console=plain
      - name: Build the release APK (unsigned, checks shrinking/R8)
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: adfree-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS core + app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift core
        run: swift test --package-path ios/AdFreeCore
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build for simulator (unsigned)
        run: |
          cd ios
          xcodebuild -project AdFree.xcodeproj -scheme AdFree \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}
