# Generate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && cd ios && xcodegen
name: AdFree
options:
  bundleIdPrefix: online.bottleneck
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""   # your Apple Developer team id; CI passes it in for release builds
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"   # CI passes the build number for release builds
packages:
  AdFreeCore:
    path: AdFreeCore
targets:
  AdFree:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.storekit"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.bottleneck.adfree
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AdFree
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/AdFree.entitlements
    scheme:
      # Lets the purchase be tested in the simulator without App Store Connect.
      storeKitConfiguration: App/AdFree.storekit
    dependencies:
      - target: AdFreeTunnel
      - package: AdFreeCore
  AdFreeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - App/SharedConfig.swift
      - path: ../blocklists/blocklist.txt
        buildPhase: resources
      - path: ../blocklists/mobile-ads.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.bottleneck.adfree.tunnel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AdFree Tunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
    info:
      path: PacketTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    dependencies:
      - package: AdFreeCore
